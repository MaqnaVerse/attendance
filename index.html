<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Maqna Attendance System</title>
  <link rel="icon" href="https://i.postimg.cc/c45dXrf8/Maqna-Profile.png" />

  <!-- Rasa macam app bila "Add to Home Screen" (iPhone & Android) -->
  <meta name="theme-color" content="#0b0c0e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="MAQNA" />
  <link rel="apple-touch-icon" href="https://i.postimg.cc/c45dXrf8/Maqna-Profile.png" />
  <link rel="manifest" href="manifest.webmanifest" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #0b0c0e; /* sama dengan tema app — tiada kilat putih semasa loading */
      overflow: hidden; /* Mencegah scroll ganda */
    }

    /* Penuhkan SELURUH skrin (termasuk bawah "home indicator" iPhone).
       100dvh di mod Home Screen iPhone berhenti sebelum bahagian bawah → kandungan app nampak "bocor". */
    .iframe-container {
      position: fixed;
      top: 0; right: 0; bottom: 0; left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <div class="iframe-container">
    <iframe
      id="app"
      src="https://script.google.com/macros/s/AKfycbwlnPRsIuQWSCuBUI0vAlyN6peDXOQNipc33LqQFIu9pF3_3BQML6MvGFscWxr6b2wGow/exec"
      scrolling="yes"
      allowfullscreen="true"
      webkitallowfullscreen="true"
      mozallowfullscreen="true"
      allow="fullscreen; camera; microphone; display-capture; geolocation;">
    </iframe>
  </div>

  <!--
    Penuh skrin di app Home Screen iPhone.
    Pepijat iOS 26.1: dalam mod Home Screen, tinggi halaman dikira terlalu pendek (lebih kurang tinggi
    bar status), jadi ada ruang kosong di bawah. Skrip ini ukur tinggi skrin sebenar dan besarkan iframe.
    Jika iOS sudah betul (26.2+), tinggi sama dan skrip tidak mengubah apa-apa.
  -->
  <script>
  (function () {
    var box = document.querySelector('.iframe-container');
    var ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    var standalone = window.navigator.standalone === true ||
      (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
    function fit() {
      if (!box || !ios || !standalone) return;
      var vh = window.innerHeight, vw = window.innerWidth;
      var full = vh >= vw ? Math.max(screen.width, screen.height) : Math.min(screen.width, screen.height);
      var gap = full - vh;
      if (gap > 0 && gap < 140) { box.style.bottom = 'auto'; box.style.height = full + 'px'; }
      else { box.style.bottom = ''; box.style.height = ''; }
    }
    fit();
    window.addEventListener('resize', fit);
    window.addEventListener('orientationchange', function () { setTimeout(fit, 350); });
    window.addEventListener('pageshow', fit);
  })();
  </script>

  <!--
    MAQNA Attendance — simpanan sesi "Ingat saya" (30 hari)
    App berjalan dalam iframe domain Google. iPhone (Safari / app Home Screen) dan Chrome yang
    sekat third-party cookies tidak benarkan iframe menyimpan data, jadi login hilang bila app ditutup.
    Skrip ini simpan token sesi pada halaman GitHub ini sendiri (storan yang kekal).
    Hanya menerima mesej daripada app Apps Script (…-script.googleusercontent.com).
  -->
  <script>
  (function () {
    var PREFIX = 'maqna_att_';
    var FROM = /^https:\/\/[a-z0-9-]+-script\.googleusercontent\.com$/;
    window.addEventListener('message', function (e) {
      var d = e.data;
      if (!FROM.test(e.origin) || !d || d.app !== 'maqna-att' || !e.source) return;
      if (['get', 'set', 'del'].indexOf(d.op) < 0 || !/^[a-z_]{1,20}$/.test(String(d.key))) return;
      var out = { app: 'maqna-att', id: d.id };
      try {
        if (d.op === 'get') out.value = localStorage.getItem(PREFIX + d.key);
        else if (d.op === 'set') localStorage.setItem(PREFIX + d.key, String(d.value).slice(0, 4000));
        else localStorage.removeItem(PREFIX + d.key);
      } catch (err) { out.error = String(err); }
      e.source.postMessage(out, e.origin);
    });
    // minta pelayar jangan padam storan halaman ini (Android / desktop)
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (err) { }
  })();
  </script>
</body>
</html>
