<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Maqna Attendance System</title>
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />

  <!-- Rasa macam app bila "Add to Home Screen" (iPhone & Android) -->
  <meta name="theme-color" content="#0b0c0e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="MAQNA" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #0b0c0e; /* sama dengan tema app — tiada kilat putih semasa loading */
      overflow: hidden; /* Mencegah scroll ganda */
    }

    /* Penuhkan SELURUH skrin (termasuk bawah "home indicator" iPhone).
       100dvh di mod Home Screen iPhone berhenti sebelum bahagian bawah → kandungan app nampak "bocor". */
    .iframe-container {
      position: fixed;
      top: 0; right: 0; bottom: 0; left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <div class="iframe-container">
    <iframe
      id="app"
      src="https://script.google.com/macros/s/AKfycbwlnPRsIuQWSCuBUI0vAlyN6peDXOQNipc33LqQFIu9pF3_3BQML6MvGFscWxr6b2wGow/exec"
      scrolling="yes"
      allowfullscreen="true"
      webkitallowfullscreen="true"
      mozallowfullscreen="true"
      allow="fullscreen; camera; microphone; display-capture; geolocation;">
    </iframe>
  </div>

  <!--
    MAQNA Attendance — simpanan sesi "Ingat saya" (30 hari)
    App berjalan dalam iframe domain Google. iPhone (Safari / app Home Screen) dan Chrome yang
    sekat third-party cookies tidak benarkan iframe menyimpan data, jadi login hilang bila app ditutup.
    Skrip ini simpan token sesi pada halaman GitHub ini sendiri (storan yang kekal).
    Hanya menerima mesej daripada app Apps Script (…-script.googleusercontent.com).
  -->
  <script>
  (function () {
    var PREFIX = 'maqna_att_';
    /* ---- Install app (Android / Chrome / Edge). Butang Install ada dalam app (Settings → App & Today). ---- */
    var deferred = null, appWin = null, appOrigin = '';
    var ua = navigator.userAgent || '';
    function standalone() { try { return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true; } catch (e) { return false; } }
    function installState() {
      return { can: !!deferred, installed: standalone(), installedBefore: (function () { try { return localStorage.getItem(PREFIX + 'installed') === '1'; } catch (e) { return false; } })(),
        standalone: standalone(), ios: /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && 'ontouchend' in document),
        android: /Android/.test(ua), inApp: /FBAN|FBAV|Instagram|Line\/|WhatsApp|; wv\)/.test(ua), samsung: /SamsungBrowser/.test(ua) };
    }
    function pushState() { if (appWin) { try { appWin.postMessage({ app: 'maqna-att', op: 'installState', value: JSON.stringify(installState()) }, appOrigin); } catch (e) { } } }
    window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferred = e; pushState(); });
    window.addEventListener('appinstalled', function () { deferred = null; try { localStorage.setItem(PREFIX + 'installed', '1'); } catch (e) { } pushState(); });
    if ('serviceWorker' in navigator) window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () { }); });
    var FROM = /^https:\/\/[a-z0-9-]+-script\.googleusercontent\.com$/;
    window.addEventListener('message', function (e) {
      var d = e.data;
      if (!FROM.test(e.origin) || !d || d.app !== 'maqna-att' || !e.source) return;
      if (['get', 'set', 'del', 'installState', 'install'].indexOf(d.op) < 0 || !/^[a-z_]{1,20}$/.test(String(d.key))) return;
      var out = { app: 'maqna-att', id: d.id };
      appWin = e.source; appOrigin = e.origin;   // untuk hantar status install bila berubah
      if (d.op === 'installState') { out.value = JSON.stringify(installState()); e.source.postMessage(out, e.origin); return; }
      if (d.op === 'install') {   // dipanggil semasa staf tekan butang Install dalam app (aktiviti pengguna)
        if (!deferred) { out.value = 'unavailable'; e.source.postMessage(out, e.origin); return; }
        var ev = deferred; deferred = null;
        try {
          ev.prompt();
          ev.userChoice.then(function (c) { out.value = c && c.outcome || 'dismissed'; e.source.postMessage(out, e.origin); pushState(); })
            .catch(function () { out.value = 'dismissed'; e.source.postMessage(out, e.origin); });
        } catch (err) { out.value = 'error'; out.error = String(err); e.source.postMessage(out, e.origin); }
        return;
      }
      try {
        if (d.op === 'get') out.value = localStorage.getItem(PREFIX + d.key);
        else if (d.op === 'set') localStorage.setItem(PREFIX + d.key, String(d.value).slice(0, 4000));
        else localStorage.removeItem(PREFIX + d.key);
      } catch (err) { out.error = String(err); }
      e.source.postMessage(out, e.origin);
    });
    // minta pelayar jangan padam storan halaman ini (Android / desktop)
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (err) { }
  })();
  </script>
</body>
</html>
